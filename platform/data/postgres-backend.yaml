# backend 전용 DB. compose 의 postgres-backend 를 옮긴 것.
apiVersion: v1
kind: Service
metadata:
  name: postgres-backend
  namespace: finch-prod
spec:
  clusterIP: None          # StatefulSet 용 headless
  selector:
    app: postgres-backend
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-backend
  namespace: finch-prod
spec:
  serviceName: postgres-backend
  replicas: 1
  selector:
    matchLabels:
      app: postgres-backend
  template:
    metadata:
      labels:
        app: postgres-backend
        app.kubernetes.io/part-of: finch
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: TZ
              value: Asia/Seoul
            # PVC 루트에 lost+found 가 있으면 initdb 가 "directory not empty" 로 죽는다.
            # 한 단계 아래를 데이터 디렉터리로 지정해 피한다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-backend-secret   # POSTGRES_USER / PASSWORD / DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
