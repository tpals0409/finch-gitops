# ai 전용 DB. RAG 임베딩 때문에 pgvector 이미지를 쓴다. compose 의 postgres-ai 를 옮긴 것.
apiVersion: v1
kind: Service
metadata:
  name: postgres-ai
  namespace: finch-prod
spec:
  clusterIP: None          # StatefulSet 용 headless
  selector:
    app: postgres-ai
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ai
  namespace: finch-prod
spec:
  serviceName: postgres-ai
  # ⚠️ **일시적으로 0 이다. 되돌릴 커밋이 곧 따라온다.**
  #
  # ai-secrets 를 봉인하며 postgres-ai 비밀번호가 새로 만들어졌는데, PVC 안의 DB 는 옛 값을
  # 그대로 들고 있어 붙지 못한다. 그 DB 는 코퍼스 복원 전이라 비어 있어 버려도 된다.
  #
  # 파드를 내려야 PVC 를 지울 수 있고, kubectl 로 내리면 Argo CD 가 self-heal 로 즉시 되돌린다
  # (실제로 그렇게 막혔다). 선언이 진실이므로 여기서 내린다.
  #
  # 순서: 이 커밋 → 파드 종료 확인 → PVC(data-postgres-ai-0) 삭제 → replicas 1 복구 커밋
  replicas: 0
  selector:
    matchLabels:
      app: postgres-ai
  template:
    metadata:
      labels:
        app: postgres-ai
        app.kubernetes.io/part-of: finch
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: TZ
              value: Asia/Seoul
            # PVC 루트에 lost+found 가 있으면 initdb 가 "directory not empty" 로 죽는다.
            # 한 단계 아래를 데이터 디렉터리로 지정해 피한다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-ai-secret   # POSTGRES_USER / PASSWORD / DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
