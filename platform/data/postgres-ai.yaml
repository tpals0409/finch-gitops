# ai 전용 DB. RAG 임베딩 때문에 pgvector 이미지를 쓴다. compose 의 postgres-ai 를 옮긴 것.
apiVersion: v1
kind: Service
metadata:
  name: postgres-ai
  namespace: finch-prod
spec:
  clusterIP: None          # StatefulSet 용 headless
  selector:
    app: postgres-ai
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ai
  namespace: finch-prod
spec:
  serviceName: postgres-ai
  replicas: 1
  selector:
    matchLabels:
      app: postgres-ai
  template:
    metadata:
      labels:
        app: postgres-ai
        app.kubernetes.io/part-of: finch
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: TZ
              value: Asia/Seoul
            # PVC 루트에 lost+found 가 있으면 initdb 가 "directory not empty" 로 죽는다.
            # 한 단계 아래를 데이터 디렉터리로 지정해 피한다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-ai-secret   # POSTGRES_USER / PASSWORD / DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # 쿠버네티스 기본 /dev/shm 은 64Mi 다. PostgreSQL 은 병렬 작업의
            # 동적 공유 메모리(dynamic_shared_memory_type=posix)를 여기에 잡는다.
            # 64Mi 로는 pgvector HNSW 병렬 빌드가 253Mi 세그먼트를 못 잡고 죽는다.
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
      volumes:
        # sizeLimit 은 상한이지 예약이 아니다 — tmpfs 는 실제로 쓴 만큼만 컨테이너
        # 메모리에 잡힌다. 관측된 최대 요구가 253Mi 라 512Mi 로 여유를 둔다.
        # 이 사용량은 컨테이너 limit(1Gi)에 산입되므로, 올릴 때는 limit 도 같이 본다.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
