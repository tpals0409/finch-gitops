# frontend — 빌드된 정적 파일을 nginx 가 서빙한다.
#
# compose 와 달라지는 점: 여기서는 /api 프록시를 하지 않는다.
# Ingress 가 /api 를 backend 로 직접 보내므로 nginx 는 정적 파일만 담당한다.
# 이미지 안의 infra/nginx/nginx.conf 에서 proxy_pass 블록을 걷어내야 한다.
replicaCount: 1

image:
  repository: ghcr.io/tpals0409/finch-frontend
  tag: sha-0fb5571c9043
  digest: ""
  pullPolicy: IfNotPresent

# GHCR 패키지를 public 으로 돌려(2026-09-07 확인) 자격증명이 필요 없다. 비워 둔다.
#
# ghcr-pull 을 참조한 채 두면 그 Secret 이 없어 kubelet 이 FailedToRetrieveImagePullSecret
# 경고를 남긴다. 이미지는 정상적으로 당겨지지만, 첫 배포에서 그 경고가 뜨면 엉뚱한 것을
# 의심하게 된다. 다시 비공개로 돌리면 scripts/seal.sh 로 ghcr-pull 을 봉인하고 여기에
# 되돌려 적는다.
imagePullSecrets: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80
  # 컨테이너는 nginxinc/nginx-unprivileged 로 뜬다 — 기본 securityContext(runAsUser 1000)로는
  # 1024 미만 포트를 못 열어 8080 을 듣는다 (infra/nginx/nginx.conf).
  targetPort: 8080

# 나머지 전부를 받는다. backend 의 /api 가 더 긴 prefix 라 먼저 매칭된다.
ingress:
  enabled: true
  className: traefik
  host: app.finchapp.org
  # Cloudflare Origin Certificate. *.finchapp.org 와일드카드라 www·admin 을
  # 붙일 때 재발급이 필요 없다. 봉인본은 platform/data/sealed-origin-tls.yaml
  tlsSecretName: finch-origin-tls
  path: /
  pathType: Prefix

# 정적 서버라 헬스 경로가 따로 없다. 루트가 200 이면 살아 있는 것이다.
probes:
  enabled: true
  startup:
    path: /
    failureThreshold: 12
    periodSeconds: 5
  liveness:
    path: /
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /
    periodSeconds: 10
    failureThreshold: 3

metrics:
  enabled: false

env:
  - name: TZ
    value: Asia/Seoul

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 128Mi
    cpu: 200m

autoscaling:
  enabled: false

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
