# backend — Spring Boot. compose 의 backend 서비스를 옮긴 것.
# 환경변수 계약은 backend/src/main/resources/application.yaml 이 정의한다.
replicaCount: 1

image:
  repository: ghcr.io/tpals0409/finch-backend
  # CI 가 이미지를 올린 뒤 자동으로 갱신한다. 첫 배포 전에는 수동으로 채운다.
  tag: sha-f787a0fc8b37
  digest: ""
  pullPolicy: IfNotPresent

# GHCR 패키지를 public 으로 돌려(2026-09-07 확인) 자격증명이 필요 없다. 비워 둔다.
#
# ghcr-pull 을 참조한 채 두면 그 Secret 이 없어 kubelet 이 FailedToRetrieveImagePullSecret
# 경고를 남긴다. 이미지는 정상적으로 당겨지지만, 첫 배포에서 그 경고가 뜨면 엉뚱한 것을
# 의심하게 된다. 다시 비공개로 돌리면 scripts/seal.sh 로 ghcr-pull 을 봉인하고 여기에
# 되돌려 적는다.
imagePullSecrets: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Spring 종료는 느리다. 종료 유예를 넉넉히 주고 preStop 으로
# 로드밸런서가 엔드포인트를 뺄 시간을 번다.
terminationGracePeriodSeconds: 40
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: app.finchapp.org
  # Cloudflare Origin Certificate. *.finchapp.org 와일드카드라 www·admin 을
  # 붙일 때 재발급이 필요 없다. 봉인본은 platform/data/sealed-origin-tls.yaml
  tlsSecretName: finch-origin-tls
  path: /api
  pathType: Prefix

# application.yaml 이 management.endpoint.health.probes.enabled 를 켜 두었다.
# liveness 와 readiness 가 분리돼 있으므로 각각 쓴다.
probes:
  enabled: true
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10
    failureThreshold: 3

# Sprint 3 에서 껐던 것을 다시 켠다. 당시엔 이 클러스터에 Prometheus Operator 가 없어
# ServiceMonitor CRD 도 없었고, true 로 두면 ArgoCD 가 "no matches for kind ServiceMonitor"
# 로 Application 전체를 Degraded 로 세우고 Deployment 조차 만들지 않았다 (첫 동기화 실측).
# 2026-09-04 서버 실측에서 Prometheus Operator 와 ServiceMonitor CRD 를 확인했다.
#
# 주의: 이 클러스터의 Grafana 와 Alertmanager 는 누락 Secret 때문에 아직 비정상이다.
# 지표가 들어오는지는 Grafana 가 아니라 Prometheus 쿼리로 확인할 것 — 대시보드가 비었다고
# 이 설정을 의심하면 엉뚱한 데서 시간을 태운다.
metrics:
  enabled: true
  path: /actuator/prometheus
  interval: 60s
  scrapeTimeout: 10s

# JWT_SECRET, KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET, DB 비밀번호가 여기 들어온다.
# SealedSecret 으로 만들어 platform/ 에 커밋한다 — 클러스터의 봉인 키가 필요하다.
envFrom:
  - secretRef:
      name: backend-secrets

env:
  - name: TZ
    value: Asia/Seoul
  # 백엔드 ↔ AI 서비스 간 공유 토큰. envFrom 이 아니라 여기서 읽는 이유는
  # scripts/seal.sh 의 finch-service-token 블록에 적혀 있다 (env 가 envFrom 을 이긴다).
  - name: BACKEND_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: finch-service-token
        key: BACKEND_SERVICE_TOKEN
  # compose 는 mem_limit 1536m 이었다. JVM 이 컨테이너 상한을 넘지 않게 비율로 묶는다.
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
  - name: POSTGRES_HOST
    value: postgres-backend
  - name: POSTGRES_PORT
    value: "5432"
  - name: REDIS_HOST
    value: redis
  - name: REDIS_PORT
    value: "6379"
  # KIS 시세 수집 (#46). 2026-09-07 서버 실측으로 확정했다.
  # 모의 호스트에서 운영 코드와 동일한 inquire-price 요청이 rt_cd=0 · stck_prpr=270000(005930)
  # 으로 돌아왔다. 실전 호스트는 토큰 발급만 되고 조회는 확인하지 않았으므로 쓰지 않는다.
  - name: KIS_BASE_URL
    value: "https://openapivts.koreainvestment.com:29443"
  # 모의 한도는 공식 SDK 의 _smartSleep = 0.5 — 초당 2건이다. 실전값 50ms 는 이 자격증명으로
  # 검증하지 않았다. 지금 핫셋이 1종목(운영 DB 실측)이라 초당 0.33건이고, 이 값은 핫셋이
  # 30종목을 넘을 때 처음 아프다. 그때 실제로 재고 바꾼다 — 그래서 상수가 아니라 주입값이다.
  - name: KIS_MIN_REQUEST_INTERVAL
    value: "500ms"
  # ⚠️ 위 주석이 예고한 자리에 왔다 — 핫셋이 30종이 되어 아프기 시작했다 (2026-09-10).
  #
  # 6 × 500ms = 3.0s 의 호출이 3s 주기 안에 정확히 들어가 여유가 0 이었다. 그 결과가
  # 운영 실패 605건 중 EGW00201("초당 거래건수를 초과하였습니다.") 598건이고,
  # 실패한 종목은 그 바퀴를 건너뛰어 캐시가 낡는다 — 공칭 순회 15s 인데 실측
  # 캐시 나이 중앙값 26.6s · 30종 중 22종이 stale-after(15s) 초과였다 (Pico 실측).
  #
  # 5 × 500ms = 2.5s 로 내려 3s 안에 0.5s 여유를 만든다. 공칭 순회는 18s 로 나빠지지만
  # (그래서 stale 초과 WARN 이 뜬다 — 의도된 신호다) 실패가 줄면 실제 나이는 26.6s 보다
  # 나아질 수 있다. **공칭을 나쁘게 만들어 실측을 좋게 하는 거래다.**
  #
  # 되돌리려면 이 값을 6 으로 되돌린다. 판정 지표는 캐시 나이 분포와 10분 창의
  # EGW00201 건수다. 이건 실험이고, 벽(모의 초당 2건) 자체는 그대로다.
  - name: KIS_PRICE_BATCH_SIZE
    value: "5"
  # 수집기 스위치. 2026-09-08 정규장 개장 전에 켰다 (Sprint 9 #46 실가동 검증).
  # ⚠️ 위 세 값 없이 true 로 두면 @Value 주입이 실패해 컨텍스트가 안 뜬다 — 로그가 아니라
  # 파드 crashloop 다. 켜는 변경과 값 주입을 절대 나눠 커밋하지 않는다.
  # KIS 실시간 시세 웹소켓 (FINCH #159). REST 폴링을 대체하지 않고 위에 얹는다 —
  # 구독 ack 를 받은 종목만 REST 순회에서 빠지고, 장애·구독 실패·상한 초과는 REST 가 계속 맡는다.
  #
  # ⚠️ 이 둘을 나눠 커밋하지 않는다. ENABLED=true 인데 URL 이 비면 빈 생성에서
  # require(url.isNotBlank()) 가 터져 **파드가 crashloop** 한다 (로그가 아니라 기동 실패다).
  #
  # 주소는 T5 실측값이다 (2026-09-10, Pico): 서버 호스트에서 31종 구독 ack 31/31 · 틱 234 ·
  # 오류 0. backend 파드에서는 210.107.75.39:31000 TCP egress 까지 확인했고,
  # WS upgrade·인증·프레임 수신은 이 배포가 첫 런타임 검증이다.
  #
  # ws:// 평문이다. approval_key 가 평문 구간을 지나므로 연결마다 새로 발급하고 캐시하지 않는다.
  #
  # 되돌리기: ENABLED 를 false 로. 그러면 웹소켓 빈이 아예 만들어지지 않고
  # (@ConditionalOnProperty) 핫셋 전체가 REST 순회로 돌아간다. 시세는 낡아지지만 끊기지 않는다.
  - name: KIS_WEBSOCKET_ENABLED
    value: "true"
  - name: KIS_WEBSOCKET_URL
    value: "ws://ops.koreainvestment.com:31000"
  - name: KIS_PRICE_ENABLED
    value: "true"
  # 전일 종가 동기화 시각. FINCH #166 이 PreviousCloseSyncJob 의 하드코딩된 08:30 을
  # finch.stock.previous-close.sync-cron 으로 빼면서 여기로 올라왔다.
  #
  # 왜 빼야 했나 (2026-09-11): 이 잡은 AI 의 price_daily 를 읽어 stock.previous_close 를
  # 채우고, 그 값이 화면의 모든 등락률 기준이 된다. 그런데 그 위의 ai-prices(06:30)·
  # price-snapshots(07:30) 가 KRX OpenAPI 발행보다 이르게 돌아 9/9 에 멈춰 있었다.
  # 실측: 06:30·07:30 에는 KRX 가 9/9, 08:32 에는 9/10 (Pico). 08:30 인 이 잡도 늦은
  # 데이터를 읽을 수 없는 자리였다. 사슬 전체가 발행 시각보다 이른 전제 위에 있었다.
  #
  # 09~10시였던 값은 2026-09-11 긴급 배포용 임시값이었다. 배포가 언제 끝날지 찍어 맞히지
  # 않으려고 넓게 잡은 것이고, 그대로 두면 내일은 09:00 — 개장 뒤에 처음 돈다.
  #
  # 08~10시로 앞당긴다. AI 적재(ai-prices·ai-price-snapshots, gitops #24)가 08:40 에
  # 돌므로 08:50 틱이 그 결과를 집어간다. 09:00 개장 시점에 stock.previous_close 가
  # 전일 종가여야 화면의 등락률 기준이 맞는다.
  #
  # 10분 간격인 이유: AI 적재가 08:40 에 pending_source 로 끝나고 09:40 에 성공하는 날도
  # 있다. 그때는 09:50 틱이 받는다. 이미 최신이면 같은 값을 다시 쓰는 것뿐이라 반복이 공짜다.
  # 평일 제한은 AI 쪽 크론과 같은 이유다.
  #
  # 6필드 Spring cron 이다 (초 분 시 일 월 요일). k8s CronJob 의 5필드와 다르다.
  - name: FINCH_STOCK_PREVIOUS_CLOSE_SYNC_CRON
    value: "0 */10 8-10 * * 1-5"

resources:
  requests:
    memory: 768Mi
    cpu: 200m
  limits:
    memory: 1536Mi
    cpu: 1000m

autoscaling:
  enabled: false

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
