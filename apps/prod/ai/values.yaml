# AI 를 켠다. 차트가 이 스위치 하나로 모든 리소스 렌더를 정한다.
#
# **코퍼스보다 먼저 켠다.** 스키마를 만드는 것이 AI 파드 기동 시의 alembic 이라, 빈 DB 에는
# 넣을 테이블이 없다. 순서와 복원 절차는 FINCH `docs/ops/deploy-runbook.md` §6 에 있다.
#
# 코퍼스가 비어 있는 동안 AI 는 고장이 아니다 — 검색이 빈 결과를 돌려주고 "관련 자료를
# 찾지 못했습니다" 로 답한다 (AI 명세 §3 "근거 없음 은 에러가 아닙니다"). document_chunks
# 10,198청크는 다시 만들 수 없어(일일 토큰 예산의 몇 배다) 백업본 복원이 유일한 길이고,
# 그 백업본은 FINCH 릴리스 `ai-corpus-20260907` 에 있다.
#
# 외부로 열지 않는다. ingress 가 없고 backend 만 http://ai:8000 으로 부른다 — AI 는
# X-User-Id 를 검증 없이 신뢰하므로 외부에서 닿으면 누구나 남의 데이터를 읽는다.
application:
  enabled: true

# ai — FastAPI. compose 의 ai 서비스를 옮긴 것.
# 외부로 열지 않는다. backend 가 클러스터 내부에서만 호출한다.
replicaCount: 1

image:
  repository: ghcr.io/tpals0409/finch-ai
  tag: sha-b6af7ec7a877
  digest: ""
  pullPolicy: IfNotPresent

# GHCR 패키지를 public 으로 돌려(2026-09-07 확인) 자격증명이 필요 없다. 비워 둔다.
#
# ghcr-pull 을 참조한 채 두면 그 Secret 이 없어 kubelet 이 FailedToRetrieveImagePullSecret
# 경고를 남긴다. 이미지는 정상적으로 당겨지지만, 첫 배포에서 그 경고가 뜨면 엉뚱한 것을
# 의심하게 된다. 다시 비공개로 돌리면 scripts/seal.sh 로 ghcr-pull 을 봉인하고 여기에
# 되돌려 적는다.
imagePullSecrets: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# ai 는 ingress 를 두지 않는다. compose 의 nginx 도 ai 로 가는 경로가 없었고,
# backend 만 http://ai:8000 으로 호출한다. 외부 노출은 공격면만 늘린다.
ingress:
  enabled: false

# 앱이 여는 것은 /health 하나뿐이다 (ai/app/api/main.py).
# liveness 와 readiness 를 나눌 근거가 없으므로 같은 경로를 쓴다.
probes:
  enabled: true
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /health
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health
    periodSeconds: 10
    failureThreshold: 3

# 아직 Prometheus 엔드포인트를 확인하지 못했다. 노출 경로가 정해지면 켠다.
metrics:
  enabled: false

# DATABASE_URL 과 외부 API 키(GMS, NAVER 등)가 여기 들어온다.
# compose 에서 infra/ai.env 로 주입하던 값들이다 — ai/.env.example 참고.
envFrom:
  - secretRef:
      name: ai-secrets

env:
  - name: TZ
    value: Asia/Seoul
  # 백엔드 ↔ AI 서비스 간 공유 토큰. envFrom 이 아니라 여기서 읽는 이유는
  # scripts/seal.sh 의 finch-service-token 블록에 적혀 있다 (env 가 envFrom 을 이긴다).
  - name: BACKEND_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: finch-service-token
        key: BACKEND_SERVICE_TOKEN
  # compose 가 environment 로 env_file 을 덮어썼던 것과 같은 의도.
  # APP_ENV 기본값이 local 이고, local 에서는 내부 토큰 검증이 통째로 꺼진다
  # (ai/app/api/deps.py). 여기서 명시해 인증을 fail-closed 로 닫는다.
  - name: APP_ENV
    value: prod
  - name: BACKEND_BASE_URL
    value: http://backend:80
  # 원장을 어디서 읽을지. 기본값이 `seed` 라 이걸 안 적으면 AI 가
  # tests/fixtures/seed_portfolio.json 을 읽는다 — 운영에서 남의 가짜
  # 포트폴리오로 답하게 된다 (2026-09-09 에 실제로 그 상태였다).
  #
  # `backend` 는 백엔드 `/internal/v1/portfolio`·`/trades` 를 부른다.
  # 그 API 는 FINCH #129 로 들어갔고, 이 값을 올리기 전에 운영에서
  # 401/401/200 을 갈라 확인했다 (Pico, 2026-09-09).
  - name: LEDGER_SOURCE
    value: backend
  # LLM 게이트웨이 주소. FINCH `ai/app/core/config.py` 의 기본값으로 박혀 있던 것을
  # 배포 설정으로 옮겼다 — 저장소에서 기관 식별자를 빼는 것이 이유고, 키(GMS_KEY)가
  # 이미 ai-secrets 에 있는 것과 같은 자리다. 주소 자체는 비밀이 아니라 평문으로 둔다.
  #
  # ⚠️ 이 값이 비면 AI 가 LLM 을 부르지 못한다. FINCH 쪽 기본값 제거보다 **먼저** 들어가야 한다.
  - name: GMS_BASE_URL
    value: https://gms.ssafy.io/gmsapi/api.openai.com/v1

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: 1000m

autoscaling:
  enabled: false

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""

# 스냅샷 적재 배치. FINCH #70 (a315fcc) 이 `python -m ingest.price_snapshots` 를 넣었고
# 이미지 sha-a315fccc5a08 부터 들어 있다.
#
# ⚠️ 이 잡은 07:30 KST 를 의도했는데 22:30 KST 에 돌고 있었다. "30 22" 를 22:30 UTC 로
# 적었지만 timeZone 이 없으면 컨트롤러 로컬 시간대(Asia/Seoul)로 해석되기 때문이다.
# 근거: lastScheduleTime=2026-09-08T13:30:00Z = 22:30 KST (Pico 관측, 2026-09-09).
# 클러스터가 v1.36.2+k3s1 이라 timeZone 을 쓸 수 있다 — 이제 현지 시각 그대로 적는다.
#
# 07:30 KST 인 이유: KRX 가 전일 종가를 확실히 내놓은 뒤이고, 백엔드의 전일 종가 배치
# (FINCH #69, 08:30 KST)보다 앞선다. ingest 는 date.today() 부터 5일을 되짚어 데이터가
# 있는 최근 거래일을 찾으므로 주말·공휴일에도 빈손으로 끝나지 않는다.
cronJobs:
  price-snapshots:
    schedule: "30 7 * * *"    # 07:30 Asia/Seoul
    timeZone: "Asia/Seoul"
    command: ["python", "-m", "ingest.price_snapshots"]

  # price_daily 증분 갱신. FINCH #87 — `ingest.prices` 는 있는데 부르는 쪽이 없어
  # 2주째 멈춰 있었다. 스냅샷과 달리 이쪽이 위험 엔진의 수정주가 시계열 원천이다.
  #
  # --existing-only 는 price_daily 에 이미 행이 있는 종목만 고른다 (FINCH #114).
  # 종목 마스터 전체를 새로 긁지 않으므로 pykrx 호출 수가 예측 가능하다.
  # 적재는 종목별 마지막 거래일 다음날부터라 밀린 만큼만 받고 끝난다.
  #
  # 06:30 인 이유: pykrx 가 전일 데이터를 내놓은 뒤이고, 07:30 스냅샷보다 앞선다.
  # 종목당 pykrx 호출 하나라 스냅샷(날짜당 1회)보다 오래 걸린다 — 기본 900초로는
  # 종목이 늘면 잘린다. 30분을 준다.
  prices:
    schedule: "30 6 * * *"    # 06:30 Asia/Seoul
    timeZone: "Asia/Seoul"
    command: ["python", "-m", "ingest.prices", "--existing-only"]
    activeDeadlineSeconds: 1800
