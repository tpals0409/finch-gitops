apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finch
  namespace: argocd
spec:
  description: FINCH ver2 — 배포 가능 범위를 명시적으로 제한한다

  sourceRepos:
    - https://github.com/tpals0409/finch-gitops.git

  # 배포 가능한 네임스페이스를 한정한다.
  # 실수로 다른 네임스페이스에 앱을 배포하는 사고를 구조적으로 막는다.
  destinations:
    - namespace: finch-prod
      server: https://kubernetes.default.svc
    # 루트 앱(app-of-apps)이 Application/ApplicationSet 리소스를 여기에 만든다.
    # 빠뜨리면 root 앱이 InvalidSpecError 로 멈춘다.
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
