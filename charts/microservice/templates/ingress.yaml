{{- if and .Values.application.enabled .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # secretName 을 이 네임스페이스의 Secret 으로 직접 가리킨다.
  #
  # 원래는 Traefik 의 전역 기본 인증서(TLSStore/default)에 기댔다 — Secret 을 네임스페이스마다
  # 복사하면 새 네임스페이스가 생길 때 조용히 깨진다는 이유였다. 그 전제가 둘 다 사라졌다.
  # 첫째, 클러스터의 TLSStore/default 가 삭제됐다 (2026-09-04 서버 실측). 기댈 기본 인증서
  # 자체가 없어 self-signed 로 떨어진다. 둘째, 우리가 쓰는 Cloudflare Origin Certificate 는
  # 유효기간이 15년이라 갱신이 없다 — 복사본이 늘어도 만료로 어긋날 일이 없다.
  #
  # 전역 TLSStore 를 세우지 않는 이유는 그게 클러스터 전체의 기본값이라서다. 이 클러스터를
  # 다른 서비스와 나눠 쓰게 되면 우리 인증서가 그쪽 기본이 돼 도메인 불일치 경고를 낸다.
  # 네임스페이스 안에 가두는 편이 비용이 같고 파급이 없다.
  #
  # 비워두면 기존 동작(Traefik self-signed)으로 떨어진다. 로컬·임시 환경용이다.
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . | quote }}
      {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "microservice.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
